name: AI PR Review

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signal:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, '@ldb-review') &&
      (github.event.action != 'labeled' || github.event.label.name == '@ldb-review')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Emit trusted review signal
        run: echo "Eligible AI review request"
