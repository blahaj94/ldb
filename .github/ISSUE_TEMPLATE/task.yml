name: Development task
description: AI agent가 구현할 하나의 bounded task를 정의합니다.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        이 Issue는 task의 목적과 acceptance criteria를 정의합니다. 세부 구현 분해는 comment와 PR에서 관리합니다.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 이 작업이 달성해야 하는 결과를 작성합니다.
      placeholder: 사용자가 얻어야 하는 결과를 작성하세요.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: User-visible behavior
      description: 외부에서 관찰 가능한 동작을 작성합니다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Test로 검증할 수 있는 완료 조건을 checklist로 작성합니다.
      placeholder: |
        - [ ] 조건 1
        - [ ] 조건 2
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      description: 이번 Issue에서 변경할 범위를 작성합니다.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: 명시적으로 변경하지 않을 범위를 작성합니다.
    validations:
      required: true

  - type: textarea
    id: execution_metadata
    attributes:
      label: Execution metadata
      description: Provider 또는 model 이름 대신 작업 특성과 필요한 capability를 기록합니다. 기본 worker_count는 1입니다.
      placeholder: |
        complexity: low | medium | high
        uncertainty: low | medium | high
        risk: low | medium | high
        worker_model_tier: low | standard | high
        worker_count: 1
        scout: no | yes
        scout_scope:
    validations:
      required: true

  - type: textarea
    id: rules
    attributes:
      label: Context pointers and related Rule documents
      description: 필요한 file path, symbol, documentation section, Issue, PR, commit, test와 관련 Rule을 작성합니다. Source나 conversation을 복사하지 않습니다.
      placeholder: |
        docs/rules/testing.md
        apps/example/src/service.ts — targetSymbol
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: "선행 관계는 `Blocked by #123`, 후속 관계는 `Blocks #456` 형식으로 작성하고 병렬 작업 충돌과 외부 dependency를 추가합니다."

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: 완료 전에 실행할 test, typecheck, lint, build command와 필요한 manual evidence를 작성합니다.
    validations:
      required: true

  - type: textarea
    id: escalation
    attributes:
      label: Escalation conditions
      description: 작업을 중단하고 Planner, high-capability reviewer 또는 사람에게 넘길 조건을 작성합니다.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Known constraints
      description: 성능, 호환성, UI/UX, 보안 등 이미 결정된 constraint를 작성합니다.

  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Security confirmation
      options:
        - label: 이 Issue에 secret, token, credential, 개인정보를 포함하지 않았습니다.
          required: true
