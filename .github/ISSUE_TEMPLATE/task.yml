name: Development task
description: AI agent가 구현할 하나의 bounded task를 정의합니다.
title: '[feat] '
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[type] 한국어 제목` 형식으로 작성하며, 기본값은 `feat`입니다. 주된 완료 결과에 맞춰 `feat`, `fix`, `refactor`, `docs`, `test`, `chore`, `design`, `research` 중 하나를 선택하세요. 각 type의 canonical 기준은 docs/rules/agent-workflow.md의 Issue 제목을 따릅니다. 이 Issue body는 현재 실행 contract와 Worker roster를 관리합니다. 결정·조건이 바뀌면 body를 갱신하고 과거 근거는 comment pointer로 연결합니다. PR은 실제 변경과 AC별 evidence를 기록합니다. 기록 기준은 docs/rules/agent-workflow.md의 Execution Issue를 따릅니다.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 이 작업이 달성해야 하는 결과를 작성합니다.
      placeholder: 사용자가 얻어야 하는 결과를 작성하세요.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: User-visible behavior
      description: 외부에서 관찰 가능한 동작을 작성합니다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Test로 검증할 수 있는 완료 조건을 checklist로 작성합니다.
      placeholder: |
        - [ ] 조건 1
        - [ ] 조건 2
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      description: 이번 Issue에서 변경할 범위를 작성합니다.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: 명시적으로 변경하지 않을 범위를 작성합니다.
    validations:
      required: true

  - type: textarea
    id: execution_metadata
    attributes:
      label: Execution metadata
      description: Provider 또는 model 이름 대신 작업 특성과 필요한 capability를 기록합니다. 전체 목표가 다르면 별도 Issue로 나눕니다.
      placeholder: |
        complexity: low | medium | high
        uncertainty: low | medium | high
        risk: low | medium | high
        worker_model_tier: low | standard | high
        scout: no | yes
        scout_scope:
    validations:
      required: true

  - type: dropdown
    id: worker_count
    attributes:
      label: worker_count
      description: 1–8 중 현재 배정 계획의 Worker roster slot 수를 선택합니다. 동시 process, Scout·Reviewer와 누적 retry는 세지 않습니다.
      options:
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        - '7'
        - '8'
      default: 0
      multiple: false
    validations:
      required: true

  - type: textarea
    id: worker_roster
    attributes:
      label: Worker roster and integration
      description: 배정 전에 Planner·통합 담당과 worker_count만큼의 현재 Worker를 기록하고 상태·head가 바뀔 때 갱신합니다. 과거 배정은 comment 이력으로 남깁니다.
      placeholder: |
        planner:
        integration_owner:
        integration_branch:
        integration_head:
        workers:
          - worker_id:
            scope:
            out_of_scope:
            dependencies:
            status: assigned | working | waiting | handed-off | integrated | stopped | failed
            branch:
            base:
            integration_order:
            result:
            validation:
            blocker:

  - type: textarea
    id: rules
    attributes:
      label: Context pointers and related Rule documents
      description: docs/README.md의 역할별 시작점을 바탕으로 필요한 file path·symbol·절과 정확한 승인 comment·선행 PR·commit·test pointer를 작성합니다. Rule·source·conversation을 복사하지 않습니다.
      placeholder: |
        docs/rules/testing.md
        apps/example/src/service.ts — targetSymbol
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: '선행 관계는 `Blocked by #123`, 후속 관계는 `Blocks #456` 형식으로 작성하고 병렬 작업 충돌과 외부 dependency를 추가합니다.'

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: 완료 전에 실행할 test, typecheck, lint, build command와 필요한 manual evidence를 작성합니다. PR에는 이 계획의 반복 대신 실제 실행 결과·차이와 evidence를 기록합니다.
    validations:
      required: true

  - type: textarea
    id: escalation
    attributes:
      label: Escalation conditions
      description: 작업을 중단하고 Planner, high-capability reviewer 또는 사람에게 넘길 조건을 작성합니다.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Known constraints
      description: 성능, 호환성, UI/UX, 보안 등 이미 결정된 constraint를 작성합니다.

  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Security confirmation
      options:
        - label: 이 Issue에 secret, token, credential, 개인정보를 포함하지 않았습니다.
          required: true
